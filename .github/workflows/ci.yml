name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  wire-visual-review:
    name: Wire visual review tool
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/visual-review'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/visual-review
          fetch-depth: 0

      - name: Patch server registration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/server.ts")
          source = path.read_text(encoding="utf-8")

          import_anchor = 'import { finalizeToolResponse } from "./server/tool-response-finalizer.js";'
          visual_import = 'import { visualReviewTool } from "./visual-review.js";'
          if visual_import not in source:
              if import_anchor not in source:
                  raise SystemExit("server import anchor not found")
              source = source.replace(import_anchor, import_anchor + "\n" + visual_import, 1)

          registration_anchor = '    registerAppTool("worktree_teardown",'
          registration = '''  registerAppTool("visual_review",
    {
      title: "[CORE] Visual Review",
      description: "[Visual] Capture a running local web app at multiple responsive viewport sizes and return screenshots directly to the model for UX/UI evaluation. Defaults to desktop, laptop, tablet, and mobile. Use customViewports for breakpoint-specific inspection. The URL must be local (localhost, 127.0.0.1, or ::1).",
      inputSchema: {
        workspaceId: z.string().describe("Workspace ID"),
        url: z.string().describe("Absolute local application URL, for example http://localhost:3000/dashboard"),
        viewports: z.array(z.enum(["wide-desktop", "desktop", "laptop", "tablet", "mobile", "compact-mobile"])).max(6).optional().describe("Responsive presets to capture. Defaults to desktop, laptop, tablet, and mobile."),
        customViewports: z.array(z.object({
          name: z.string().min(1).max(80),
          width: z.number().int().min(320).max(2560),
          height: z.number().int().min(480).max(1600),
        })).max(6).optional().describe("Optional custom viewport sizes for breakpoint-specific inspection."),
        waitMs: z.number().int().min(0).max(10000).optional().describe("Virtual time budget before each screenshot. Defaults to 750ms."),
      },
      outputSchema: resultOutputSchema(),
      ...toolWidgetDescriptorMeta(config, "read"),
      annotations: READ_TOOL_ANNOTATIONS,
    } as any,
    async (req: any) => {
      workspaces.getWorkspace(req.workspaceId);
      return visualReviewTool({
        url: req.url,
        viewports: req.viewports,
        customViewports: req.customViewports,
        waitMs: req.waitMs,
      });
    },
  );

'''
          if 'registerAppTool("visual_review"' not in source:
              if registration_anchor not in source:
                  raise SystemExit("server registration anchor not found")
              source = source.replace(registration_anchor, registration + registration_anchor, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Restore CI workflow and commit server wiring
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "No wiring changes needed."
            exit 0
          fi
          git commit -m "feat: register visual review MCP tool"
          git push origin HEAD:feature/visual-review

  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      AGENTIC_ALLOWED_ROOTS: ${{ github.workspace }}
      AGENTIC_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      AGENTIC_PUBLIC_BASE_URL: http://127.0.0.1:7676

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Doctor
        run: node dist/cli.js doctor

      - name: Package Smoke Test
        run: npm run smoke:package

      - name: HTTP Authentication Test
        run: npm run test:http

      - name: Packaged MCP Runtime Test
        if: matrix.os != 'macos-latest'
        run: npm run test:runtime:built

  security-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit source production tree
        run: npm audit --omit=dev --audit-level=high

      - name: Audit installed package
        run: |
          PACKAGE_TGZ=$(npm pack --json | node scripts/pack-name.mjs)
          mkdir .ci-release-smoke
          npm install --prefix .ci-release-smoke "./$PACKAGE_TGZ"
          npm audit --prefix .ci-release-smoke --omit=dev --audit-level=high
