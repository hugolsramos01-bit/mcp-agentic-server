name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      AGENTIC_ALLOWED_ROOTS: ${{ github.workspace }}
      AGENTIC_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      AGENTIC_PUBLIC_BASE_URL: http://127.0.0.1:7676

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Doctor
        run: node dist/cli.js doctor

      - name: Package Smoke Test
        run: npm run smoke:package

      - name: HTTP Authentication Test
        run: npm run test:http

      - name: Packaged MCP Runtime Test
        if: matrix.os != 'macos-latest'
        run: npm run test:runtime:built

  security-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit source production tree
        run: npm audit --omit=dev --audit-level=high

      - name: Audit installed package
        run: |
          PACKAGE_TGZ=$(npm pack --json | node scripts/pack-name.mjs)
          mkdir .ci-release-smoke
          npm install --prefix .ci-release-smoke "./$PACKAGE_TGZ"
          npm audit --prefix .ci-release-smoke --omit=dev --audit-level=high
